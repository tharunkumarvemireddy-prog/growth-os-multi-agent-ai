services:
  - type: web
    name: growth-os-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: growth-os
      - key: MODEL_NAME
        value: gpt-4o-mini
      - key: TEMPERATURE
        value: "0.4"
